<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wierez Mylo | Contact</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function(){
            emailjs.init("WttCDsksptIN8rYJM"); // Ta clé publique est bien placée
        })();
    </script>
</head>
<body>
    <nav>
        <div class="logo">Wierez Mylo</div>
        <ul>
            <li><a href="index.html">Accueil</a></li>
            <li><a href="projets.html">Projets</a></li>
            <li><a href="stages.html">Stages</a></li>
            <li><a href="veille.html">Veille</a></li>
            <li><a href="E5.html">E5</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </nav>

    <section class="content-section contact-page">
        <div class="contact-card">
            <h2>Me contacter</h2>
            <p>Un projet, une question ou une offre de stage ? N'hésitez pas !</p>
            
            <form id="contact-form">
                <input type="text" name="from_name" placeholder="Votre Nom" required>
                <input type="email" name="reply_to" placeholder="Votre Email" required>
                <textarea name="message" placeholder="Votre message" rows="5" required></textarea>
                <button type="submit" class="btn">Envoyer le message</button>
            </form>

            <hr class="separator">

            <h3>Retrouvez-moi sur</h3>
            <div class="social-links">
                <a href="https://github.com/Mylow04" target="_blank" class="social-box github">
                    <i class="fab fa-github"></i> GitHub
                </a>
                <a href="https://www.linkedin.com/in/mylo-wierez" target="_blank" class="social-box linkedin">
                    <i class="fab fa-linkedin"></i> LinkedIn
                </a>
                <a href="mailto:mylo.wierez@ecoles-epsi.net" class="social-box email">
                    <i class="fas fa-envelope"></i> Email
                </a>
            </div> 
        </div> 
    </section>
            
    <footer id="contact">
        <p>Wierez Mylo - 2026 | mylo.wierez@ecoles-epsi.net</p>
    </footer>

    <script type="text/javascript">
        document.getElementById('contact-form').addEventListener('submit', function(event) {
            event.preventDefault(); // Empêche le rechargement brutal de la page

            const serviceID = 'service_hpryq2d';
            const templateID = 'template_6pqc00v';

            // Envoi des données du formulaire
            emailjs.sendForm(serviceID, templateID, this)
                .then(function() {
                    alert('Message envoyé avec succès !');
                    document.getElementById('contact-form').reset(); // Vide les champs après envoi
                }, function(error) {
                    alert("Échec de l'envoi... Erreur : " + JSON.stringify(error));
                });
        });
    </script>
</body>
</html>
